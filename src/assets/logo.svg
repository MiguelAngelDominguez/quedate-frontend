  <!-- Wordmark "Quédate" como texto (Space Grotesk) -->
  <text x="0" y="44" font-family="Space Grotesk, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.5">
    <tspan fill="currentColor">Qué</tspan>
    <tspan fill="#0d9488">date</tspan>
  </text>
</svg>